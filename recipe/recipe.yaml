schema_version: 1

context:
  version: 2.0.0

package:
  name: pysmi
  version: ${{ version }}

source:
- url: https://files.pythonhosted.org/packages/source/p/pysmi/pysmi-${{ version }}.tar.gz
  sha256: 9eeba85ed59c5de38f512fe9858ce3332864526f7efc8135b3e3f552666cf79b

build:
  number: 0
  script: ${{ PYTHON }} -m pip install . --no-deps -vv --no-build-isolation
  python:
    entry_points:
    - mibcopy = pysmi.scripts.mibcopy:start
    - mibdump = pysmi.scripts.mibdump:start
  noarch: python

requirements:
  host:
    - python ${{ python_min }}.*
    - flit-core >=3.9.0
    - setuptools
    - pip
  run:
    - python >=${{ python_min }},<4.0
    - jinja2 <4.0.0,>=3.1.3
    - requests >=2.26.0
    - lark >=1.1.9

tests:
  - python:
      imports:
        - pysmi
        - pysmi.borrower
        - pysmi.codegen
        - pysmi.lexer
        - pysmi.parser
        - pysmi.reader
        - pysmi.searcher
        - pysmi.writer
      pip_check: false
      python_version:
        - ${{ python_min }}.*
        - '*'

about:
  license: BSD-2-Clause
  license_file: LICENSE.rst
  summary: SNMP SMI/MIB Parser
  description: A pure-Python implementation of SNMP/SMI MIB parsing and conversion library.
  homepage: http:/pysmi.sf.net
  repository: https://github.com/etingof/pysmi
  documentation: http://snmplabs.com/pysmi/#documentation

extra:
  recipe-maintainers:
    - nehaljwani
    - jsmolic
